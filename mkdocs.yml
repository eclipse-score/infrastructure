site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the development, structure, and operation of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
docs_dir: docs
strict: true

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Infrastructure Development Map:
      - Development Map: infrastructure-development-map.md
      - Work Breakdown Structure: work-breakdown-structure.md
  - Infrastructure Areas:
      - Source Code Infrastructure: areas/source-code-infrastructure/index.md
      - Build Infrastructure: areas/build-infrastructure/index.md
      - Integration Infrastructure: areas/integration-infrastructure/index.md
      - Artifact Infrastructure: areas/artifact-infrastructure/index.md
      - Testing Infrastructure: areas/testing-infrastructure/index.md
      - Security & Compliance Infrastructure: areas/security-and-compliance-infrastructure/index.md
      - Documentation Infrastructure: areas/documentation-infrastructure/index.md
      - Infrastructure Operations: areas/infrastructure-operations/index.md
  - Guides:
      - Overview: guides/index.md
      - Repository onboarding: guides/repository-onboarding.md
      - Repository policies: guides/repository-policies.md
      - Bazel and dependencies: guides/bazel-and-dependencies.md
      - CI workflows: guides/cicd-workflows.md
      - Artifact publishing: guides/artifact-publishing.md
      - Testing and reporting: guides/testing-and-reporting.md
      - License compliance and SBOM: guides/license-compliance-and-sbom.md
      - Documentation publishing: guides/documentation-publishing.md
      - Infrastructure maintenance: guides/operations-and-maintenance.md
  - Architecture:
      - Overview: architecture/index.md
      - Infrastructure model: architecture/infrastructure-model.md
      - Tool landscape: architecture/tool-landscape.md
      - Cross-cutting concerns: architecture/cross-cutting-concerns.md
