site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the structure, operation, and evolution of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
edit_uri: edit/dev/docs/
docs_dir: docs
strict: true

theme:
  name: readthedocs
  logo: img/score-logo.svg

extra_css:
  - css/score-theme.css

extra_javascript:
  - js/mindmap.js

plugins:
  - search
  - mermaid2:
      version: '11.12.2'
      arguments:
        securityLevel: loose

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Chapters:
      - 1. Source Code Infrastructure: 01-source-code-infrastructure.md
      - 2. Developer Environment: 02-developer-environment.md
      - 3. Build & Dependencies: 03-build-infrastructure.md
      - 4. Testing: 04-testing-infrastructure.md
      - 5. Code Analysis Infrastructure: 05-static-analysis-infrastructure.md
      - 6. Compliance & Dependency Analysis: 06-compliance-infrastructure.md
      - 7. Automation & CI: 07-automation-integration.md
      - 8. Release & Distribution: 08-artifact-distribution.md
      - 9. Documentation & Traceability: 09-documentation-infrastructure.md
      - 10. Infrastructure Operations: 10-infrastructure-operations.md
  - "Preview: Divio":
      - Overview: preview/divio/index.md
      - Tutorials:
          - Getting Started: preview/divio/tutorials/getting-started.md
          - Your First Pull Request: preview/divio/tutorials/first-pull-request.md
          - Creating a New Module: preview/divio/tutorials/creating-a-module.md
      - How-to Guides:
          - Building with Bazel: preview/divio/how-to/building.md
          - Testing: preview/divio/how-to/testing.md
          - Code Quality: preview/divio/how-to/code-quality.md
          - Publishing Modules: preview/divio/how-to/publishing.md
          - Writing Documentation: preview/divio/how-to/writing-docs.md
      - Reference:
          - Quick Reference: preview/divio/reference/quick-reference.md
          - Configuration: preview/divio/reference/configuration.md
          - CI & Workflows: preview/divio/reference/ci-workflows.md
          - Tool Versions: preview/divio/reference/tool-versions.md
      - Explanation:
          - 1. Source Code Infrastructure: preview/divio/explanation/01-source-code-infrastructure.md
          - 2. Developer Environment: preview/divio/explanation/02-developer-environment.md
          - 3. Build & Dependencies: preview/divio/explanation/03-build-infrastructure.md
          - 4. Testing: preview/divio/explanation/04-testing-infrastructure.md
          - 5. Code Analysis Infrastructure: preview/divio/explanation/05-static-analysis-infrastructure.md
          - 6. Compliance & Dependency Analysis: preview/divio/explanation/06-compliance-infrastructure.md
          - 7. Automation & CI: preview/divio/explanation/07-automation-integration.md
          - 8. Release & Distribution: preview/divio/explanation/08-artifact-distribution.md
          - 9. Documentation & Traceability: preview/divio/explanation/09-documentation-infrastructure.md
          - 10. Infrastructure Operations: preview/divio/explanation/10-infrastructure-operations.md
