site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the structure, operation, and evolution of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
edit_uri: edit/dev/docs/
docs_dir: docs
strict: true

theme:
  name: readthedocs
  logo: img/score-logo.svg

extra_css:
  - css/score-theme.css

extra_javascript:
  - js/mindmap.js

plugins:
  - search
  - mermaid2:
      version: '11.12.2'
      arguments:
        securityLevel: loose

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Chapters:
      - 1. Source Code Infrastructure: 01-source-code-infrastructure.md
      - 2. Developer Environment: 02-developer-environment.md
      - 3. Build & Dependencies: 03-build-infrastructure.md
      - 4. Testing: 04-testing-infrastructure.md
      - 5. Code Analysis Infrastructure: 05-static-analysis-infrastructure.md
      - 6. Dependency Analysis Infrastructure: 06-compliance-infrastructure.md
      - 7. Automation & CI: 07-automation-integration.md
      - 8. Release & Distribution: 08-artifact-distribution.md
      - 9. Documentation & Traceability: 09-documentation-infrastructure.md
      - 10. Infrastructure Operations: 10-infrastructure-operations.md
