site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the development, structure, and operation of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
docs_dir: docs
strict: true

theme:
  name: readthedocs
  logo: img/score-logo.svg

extra_css:
  - css/score-theme.css

extra_javascript:
  - https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs

plugins:
  - search
  - mermaid2:
      arguments:
        securityLevel: loose

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Chapters:
      - 1. Source Code Infrastructure: source-code-infrastructure.md
      - 2. Build Infrastructure: build-infrastructure.md
      - 3. Testing Infrastructure: testing-infrastructure.md
      - 4. Static Analysis Infrastructure: static-analysis-infrastructure.md
      - 5. Automation & CI/CD: automation-integration.md
      - 6. Artifact & Distribution: artifact-distribution.md
      - 7. Compliance Infrastructure: compliance-infrastructure.md
      - 8. Documentation Infrastructure: documentation-infrastructure.md
      - 9. Infrastructure Operations: infrastructure-operations.md
      - 10. Developer Environment: developer-environment.md
      - 11. Security Infrastructure: security-infrastructure.md
