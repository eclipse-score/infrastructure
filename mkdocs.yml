site_name: S-CORE Infrastructure Documentation
site_description: Technical infrastructure documentation for the S-CORE project
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
docs_dir: docs
strict: true

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Overview:
      - Overview: overview/overview.md
      - How to use this documentation: overview/how-to-use-this-documentation.md
      - Where to start: overview/where-to-start.md
  - Start Here:
      - Platform Overview: start-here/platform-overview.md
      - Capability Map: start-here/capability-map.md
      - Working with this repository: start-here/working-with-this-repository.md
  - Work Ahead:
      - Work Breakdown Structure: work-ahead/work-breakdown-structure.md
      - Contribution Areas: work-ahead/contribution-areas.md
      - Current focus areas: work-ahead/current-focus-areas.md
  - Platform Areas:
      - Source Platform: source/overview.md
      - Build Platform: build/overview.md
      - CI/CD Platform: cicd/overview.md
      - Artifact Platform: artifacts/overview.md
      - Testing Platform: testing/overview.md
      - Security & Compliance Platform: security/overview.md
      - Documentation Platform: documentation/overview.md
      - Platform Operations: operations/overview.md
  - Guides:
      - Overview: guides/overview.md
      - Repository onboarding: guides/repository-onboarding.md
      - Repository policies: guides/repository-policies.md
      - Bazel and dependencies: guides/bazel-and-dependencies.md
      - CI/CD workflows: guides/cicd-workflows.md
      - Artifact publishing: guides/artifact-publishing.md
      - Testing and reporting: guides/testing-and-reporting.md
      - License compliance and SBOM: guides/license-compliance-and-sbom.md
      - Documentation publishing: guides/documentation-publishing.md
      - Operations and maintenance: guides/operations-and-maintenance.md
  - Architecture:
      - Platform model: architecture/platform-model.md
      - Tool landscape: architecture/tool-landscape.md
      - Cross-cutting concerns: architecture/cross-cutting-concerns.md