site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the development, structure, and operation of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
docs_dir: docs
strict: true

theme:
  name: readthedocs

plugins:
  - search
  - mermaid2:
      arguments:
        securityLevel: loose

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Chapters:
      - 1. Source Code Infrastructure: chapters/01-source-code-infrastructure.md
      - 2. Build Infrastructure: chapters/02-build-infrastructure.md
      - 3. Testing Infrastructure: chapters/03-testing-infrastructure.md
      - 4. Automation & CI/CD: chapters/04-automation-integration.md
      - 5. Artifact & Distribution: chapters/05-artifact-distribution.md
      - 6. Compliance Infrastructure: chapters/06-compliance-infrastructure.md
      - 7. Documentation Infrastructure: chapters/07-documentation-infrastructure.md
      - 8. Infrastructure Operations: chapters/08-infrastructure-operations.md
      - 9. Developer Environment: chapters/09-developer-environment.md
      - 10. Security Infrastructure: chapters/10-security-infrastructure.md
