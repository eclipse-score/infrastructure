site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the structure, operation, and evolution of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
edit_uri: edit/dev/docs/
docs_dir: docs
strict: true

theme:
  name: readthedocs
  logo: img/score-logo.svg

extra_css:
  - css/score-theme.css

extra_javascript:
  - js/mindmap.js

plugins:
  - search
  - mermaid2:
      version: '11.12.2'
      arguments:
        securityLevel: loose

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Tutorials:
      - Getting Started: tutorials/getting-started.md
      - Your First Pull Request: tutorials/first-pull-request.md
      - Creating a New Module: tutorials/creating-a-module.md
  - How-to Guides:
      - Building with Bazel: how-to/building.md
      - Testing: how-to/testing.md
      - Code Quality: how-to/code-quality.md
      - Publishing Modules: how-to/publishing.md
      - Writing Documentation: how-to/writing-docs.md
  - Reference:
      - Quick Reference: reference/quick-reference.md
      - Configuration: reference/configuration.md
      - CI & Workflows: reference/ci-workflows.md
      - Tool Versions: reference/tool-versions.md
  - Explanation:
      - Overview: explanation/index.md
      - 1. Source Code Infrastructure: explanation/01-source-code-infrastructure.md
      - 2. Developer Environment: explanation/02-developer-environment.md
      - 3. Build & Dependencies: explanation/03-build-infrastructure.md
      - 4. Testing: explanation/04-testing-infrastructure.md
      - 5. Code Analysis Infrastructure: explanation/05-static-analysis-infrastructure.md
      - 6. Compliance & Dependency Analysis: explanation/06-compliance-infrastructure.md
      - 7. Automation & CI: explanation/07-automation-integration.md
      - 8. Release & Distribution: explanation/08-artifact-distribution.md
      - 9. Documentation & Traceability: explanation/09-documentation-infrastructure.md
      - 10. Infrastructure Operations: explanation/10-infrastructure-operations.md
