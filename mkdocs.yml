site_name: S-CORE Infrastructure Documentation
site_description: Documentation for the development, structure, and operation of S-CORE project infrastructure
site_url: https://eclipse-score.github.io/infrastructure/
repo_name: eclipse-score/infrastructure
repo_url: https://github.com/eclipse-score/infrastructure
docs_dir: docs
strict: true

theme:
  name: readthedocs
  logo: img/score-logo.svg

extra_css:
  - css/score-theme.css

extra_javascript:
  - https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs

plugins:
  - search
  - mermaid2:
      arguments:
        securityLevel: loose

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Chapters:
      - 1. Source Code Infrastructure: chapters/01-source-code-infrastructure.md
      - 2. Build Infrastructure: chapters/02-build-infrastructure.md
      - 3. Testing Infrastructure: chapters/03-testing-infrastructure.md
      - 4. Static Analysis Infrastructure: chapters/04-static-analysis-infrastructure.md
      - 5. Automation & CI/CD: chapters/04-automation-integration.md
      - 6. Artifact & Distribution: chapters/05-artifact-distribution.md
      - 7. Compliance Infrastructure: chapters/06-compliance-infrastructure.md
      - 8. Documentation Infrastructure: chapters/07-documentation-infrastructure.md
      - 9. Infrastructure Operations: chapters/08-infrastructure-operations.md
      - 10. Developer Environment: chapters/09-developer-environment.md
      - 11. Security Infrastructure: chapters/10-security-infrastructure.md
